<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lume Fitness - Ingresso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-card: #111111;
            --bg-card-hover: #1a1a2e;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent-pink: #e91e63;
            --accent-cyan: #00bcd4;
            --accent-green: #4caf50;
            --accent-orange: #ff9800;
            --accent-purple: #9c27b0;
            --border-color: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== SLIDES CONTAINER ===== */
        .slides-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 1;
        }

        .slide.active {
            opacity: 1;
            z-index: 2;
        }

        /* ===== VIDEO SLIDE ===== */
        .video-slide {
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .video-slide video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Video error / fallback overlay */
        .video-error-overlay {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            background: #000;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }

        .video-error-overlay.visible {
            display: flex;
        }

        .video-error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .video-error-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .video-error-desc {
            font-size: 18px;
            max-width: 500px;
            line-height: 1.5;
        }

        /* Loading state */
        .video-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
        }

        .video-loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent-pink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Video info bar */
        .video-info-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 30px;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .video-info-bar.visible {
            display: flex;
        }

        .video-lesson-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(233, 30, 99, 0.25);
            border: 2px solid var(--accent-pink);
            border-radius: 50px;
            padding: 8px 20px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .video-lesson-badge .badge-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-pink);
            animation: pulse 2s infinite;
        }

        .video-controls-hint {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== PLANNING SLIDE ===== */
        .planning-slide {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            padding: 40px 60px;
        }

        /* Header */
        .planning-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .planning-logo {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .planning-logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-cyan));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 24px;
        }

        .planning-logo-text {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .planning-location {
            font-size: 24px;
            color: var(--accent-pink);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .planning-clock {
            font-size: 36px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-secondary);
        }

        /* Main Content */
        .planning-main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            overflow: hidden;
        }

        /* Current Class Section */
        .current-section {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px;
            border: 3px solid var(--accent-green);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .current-section::before {
            content: 'IN CORSO';
            position: absolute;
            top: 20px;
            right: -60px;
            background: var(--accent-green);
            padding: 8px 80px;
            transform: rotate(45deg);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .current-label {
            font-size: 20px;
            color: var(--accent-green);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .current-name {
            font-size: 56px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .current-time {
            font-size: 32px;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .current-instructor {
            font-size: 24px;
            color: var(--text-secondary);
        }

        .current-availability {
            margin-top: 30px;
            padding: 20px 30px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 16px;
            border: 2px solid var(--accent-green);
            display: inline-block;
        }

        .current-availability-text {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-green);
        }

        /* Sala Libera State */
        .sala-libera-big {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .sala-libera-icon {
            font-size: 120px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }

        .sala-libera-title {
            font-size: 56px;
            font-weight: 900;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 15px;
        }

        .sala-libera-subtitle {
            font-size: 28px;
            color: var(--text-secondary);
        }

        /* ===== ROOMS GRID ===== */
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            flex: 1;
            overflow: hidden;
        }

        .room-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px;
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .room-card.active {
            border-color: var(--accent-green);
            background: linear-gradient(135deg, rgba(76,175,80,0.1), var(--bg-card));
        }

        .room-card.empty {
            border-color: var(--accent-orange);
            background: linear-gradient(135deg, rgba(255,152,0,0.05), var(--bg-card));
        }

        .room-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .room-name {
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .room-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .room-status.live {
            background: rgba(76, 175, 80, 0.2);
            color: var(--accent-green);
            animation: pulse 2s infinite;
        }

        .room-status.free {
            background: rgba(255, 152, 0, 0.2);
            color: var(--accent-orange);
        }

        .room-status.next {
            background: rgba(0, 188, 212, 0.2);
            color: var(--accent-cyan);
        }

        .room-current {
            margin-bottom: 15px;
        }

        .room-current-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .room-current-class {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.2;
        }

        .room-current-time {
            font-size: 16px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .room-current-instructor {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .room-availability {
            margin-top: auto;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
        }

        .room-availability.available {
            background: rgba(76, 175, 80, 0.15);
            color: var(--accent-green);
        }

        .room-availability.full {
            background: rgba(233, 30, 99, 0.15);
            color: var(--accent-pink);
        }

        .room-availability.waiting {
            background: rgba(255, 152, 0, 0.15);
            color: var(--accent-orange);
        }

        .room-next {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .room-next-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .room-next-class {
            font-size: 16px;
            font-weight: 600;
        }

        .room-next-time {
            font-size: 14px;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .room-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .room-badge.sala1 { background: rgba(233, 30, 99, 0.2); color: var(--accent-pink); }
        .room-badge.sala2 { background: rgba(0, 188, 212, 0.2); color: var(--accent-cyan); }
        .room-badge.sala3 { background: rgba(156, 39, 176, 0.2); color: var(--accent-purple); }
        .room-badge.piscina { background: rgba(255, 152, 0, 0.2); color: var(--accent-orange); }

        /* Progress Bar */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-cyan));
            transition: width 0.1s linear;
        }

        /* Connection Status */
        .conn-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
            background: rgba(76, 175, 80, 0.2);
            color: var(--accent-green);
        }

        .conn-status.offline {
            background: rgba(233, 30, 99, 0.2);
            color: var(--accent-pink);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .planning-main {
                grid-template-columns: 1fr;
            }
            .rooms-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .current-name {
                font-size: 36px;
            }
            .planning-slide {
                padding: 20px 30px;
            }
        }

        @media (max-width: 600px) {
            .rooms-grid {
                grid-template-columns: 1fr;
            }
            .planning-header {
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== SLIDE 1: VIDEO (dinamico per lezione) ===== -->
    <div class="slide video-slide active" id="videoSlide">
        <!-- Loading -->
        <div class="video-loading" id="videoLoading" aria-live="polite" aria-label="Caricamento video in corso">
            <div class="video-loading-spinner" aria-hidden="true"></div>
            <div id="videoLoadingText">Caricamento video...</div>
        </div>

        <!-- Errore video -->
        <div class="video-error-overlay" id="videoError" role="alert" aria-live="assertive">
            <div class="video-error-icon" aria-hidden="true">&#9888;</div>
            <div class="video-error-title" id="videoErrorTitle">Video non disponibile</div>
            <div class="video-error-desc" id="videoErrorDesc"></div>
        </div>

        <!-- Video HTML5 -->
        <video
            id="promoVideo"
            aria-label="Video lezione"
            controls
            playsinline
            muted
            style="display: none;">
            <source src="" type="video/mp4">
            <p>Il tuo browser non supporta la riproduzione video.
               <a href="#" id="videoDownloadLink">Scarica il video</a>.
            </p>
        </video>

        <!-- Info bar (mostrata quando video è in play) -->
        <div class="video-info-bar" id="videoInfoBar" aria-live="polite">
            <div class="video-lesson-badge" id="videoLessonBadge">
                <span class="badge-dot" aria-hidden="true"></span>
                <span id="videoLessonName">—</span>
            </div>
            <div class="video-controls-hint" aria-hidden="true">
                &#9654; Riproduzione in corso &nbsp;|&nbsp; Usa i controlli per play/pausa
            </div>
        </div>
    </div>

    <!-- ===== SLIDE 2: PLANNING ===== -->
    <div class="slide planning-slide" id="planningSlide">
        <div class="planning-header">
            <div class="planning-logo">
                <div class="planning-logo-icon" aria-hidden="true">LF</div>
                <div class="planning-logo-text">LUME FITNESS</div>
            </div>
            <div class="planning-location" id="planningLocation">Macerata</div>
            <div class="planning-clock" id="planningClock" aria-live="polite" aria-label="Orologio">--:--</div>
        </div>

        <div class="rooms-grid" id="roomsGrid" role="list" aria-label="Sale fitness">
            <!-- Le sale vengono generate dinamicamente -->
        </div>

        <div class="progress-bar" id="progressBar" style="width: 0%" aria-hidden="true"></div>
    </div>

    <!-- Connection status -->
    <div class="conn-status" id="connStatus" role="status" aria-live="polite">
        <div class="status-dot" aria-hidden="true"></div>
        <span id="connStatusText">Live</span>
    </div>

    <script>
        // ================================================================
        // CONFIGURAZIONE
        // ================================================================
        const CONFIG = {
            // File di mappatura lezione → video S3
            // Può essere un percorso locale o un URL remoto
            mappingUrl: 'lezioni-mapping.json',

            // URL base S3 per i video delle lezioni
            // Formato: {s3_base_url}/{slug}.mp4
            s3_base_url: 'https://mybrand-media-moon.s3.eu-central-1.amazonaws.com/SITO%20ASSET/Progetti',

            // URL video promo (fallback quando nessuna lezione è in corso)
            promo_video_url: null,  // compilato da mappingUrl

            // Fallback YouTube (quando S3 non ha il video)
            fallback_youtube_id: 'jNQXAC9IVRw',  // placeholder — sostituire con video Axel Pop ufficiale

            // API per dati lezioni
            apiUrl: '/api/all-classes',

            // Location (club)
            location: 'Macerata',

            // Durata slide (millisecondi)
            videoDuration: 30000,
            planningDuration: 30000,

            // Intervallo refresh dati (ms)
            refreshInterval: 60000,

            // Chiave querystring per forzare una lezione
            lessonParam: 'lezione',

            // Durata slide video per lezione singola (ms)
            // Dopo di che torna alla rotazione normale
            singleLessonDuration: 60000,
        };

        // ================================================================
        // STATE
        // ================================================================
        let currentVideoIndex = 0;
        let currentSlide = 0;          // 0 = video, 1 = planning
        let lastDataHash = '';
        let classesData = null;        // dati lezioni dalla API
        let mappingData = null;        // dati mappatura lezione → video
        let lessonMapping = {};        // { "yoga vinyasa": { slug: "YOGA", ... }, ... }
        let slideTimer = null;
        let progressTimer = null;

        // Stato video corrente
        let currentVideoSource = null;   // 'lesson' | 'promo' | 'fallback'
        let currentLessonSlug = null;    // slug della lezione corrente

        // Modalità override da querystring
        let forcedLesson = null;         // lezione forzata da ?lezione=

        // ================================================================
        // UTILITY
        // ================================================================

        /**
         * Estrae i parametri querystring dalla URL corrente.
         * @returns {Object} mappa chiave → valore
         */
        function getQueryParams() {
            const params = {};
            try {
                const search = window.location.search.substring(1);
                search.split('&').forEach(pair => {
                    const [k, v] = pair.split('=').map(decodeURIComponent);
                    if (k) params[k] = v || '';
                });
            } catch (e) {
                console.warn('Errore parsing querystring:', e);
            }
            return params;
        }

        /**
         * Normalizza un nome lezione per matching.
         * Converte in minuscolo, rimuove spazi extra e accenti comuni.
         * @param {string} name
         * @returns {string}
         */
        function normalizeLessonName(name) {
            if (!name) return '';
            return name
                .toLowerCase()
                .trim()
                .replace(/\s+/g, ' ')   // multiple spaces → single
                .replace(/[''']/g, "'"); // normalizza apostrofi
        }

        /**
         * Calcola un hash semplice per confrontare i dati.
         * @param {*} data
         * @returns {number}
         */
        function hashData(data) {
            return JSON.stringify(data).split('').reduce((a, b) => {
                a = ((a << 5) - a) + b.charCodeAt(0);
                return a & a;
            }, 0);
        }

        /**
         * Normalizza il nome lezione per ricerca nel mapping.
         * Supporta corrispondenza parziale (contains).
         */
        function findMappingEntry(lessonName, mapping) {
            if (!lessonName || !mapping) return null;
            const normalized = normalizeLessonName(lessonName);

            // 1. Ricerca esatta normalizzata
            if (mapping[normalized]) return mapping[normalized];

            // 2. Ricerca per chiave del mapping (anche parziale)
            for (const key of Object.keys(mapping)) {
                if (normalized.includes(key) || key.includes(normalized)) {
                    return mapping[key];
                }
            }

            return null;
        }

        /**
         * Costruisce l'URL S3 per uno slug.
         * @param {string} slug
         * @returns {string}
         */
        function buildS3Url(slug) {
            if (!slug) return null;
            return `${CONFIG.s3_base_url}/${encodeURIComponent(slug)}.mp4`;
        }

        /**
         * Trova la lezione attualmente in corso.
         * @returns {Object|null} la classe corrente
         */
        function getCurrentClass() {
            if (!classesData) return null;
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const dayName = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'][now.getDay()];
            const todayClasses = classesData.classes?.[CONFIG.location]?.[dayName] || [];

            for (const cls of todayClasses) {
                const [h, m] = (cls.time || '').split(':').map(Number);
                if (isNaN(h) || isNaN(m)) continue;
                const startMinutes = h * 60 + m;
                const duration = parseInt(cls.duration) || 60;
                const endMinutes = startMinutes + duration;
                if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
                    return cls;
                }
            }
            return null;
        }

        // ================================================================
        // CLOCK
        // ================================================================
        function updateClock() {
            const el = document.getElementById('planningClock');
            if (el) {
                el.textContent = new Date().toLocaleTimeString('it-IT', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ================================================================
        // CONNECTION STATUS
        // ================================================================
        function updateConnectionStatus(online) {
            const status = document.getElementById('connStatus');
            const text = document.getElementById('connStatusText');
            if (!status || !text) return;
            status.classList.toggle('offline', !online);
            text.textContent = online ? 'Live' : 'Offline';
        }

        // ================================================================
        // FETCH — MAPPING
        // ================================================================
        async function fetchMapping() {
            try {
                const response = await fetch(`${CONFIG.mappingUrl}?t=${Date.now()}`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.warn('[VideoPlayer] Impossibile caricare lezioni-mapping.json:', error.message);
                return null;
            }
        }

        /**
         * Processa il mapping e costruisce la lookup table normalizzata.
         * @param {Object} data  il JSON caricato da lezioni-mapping.json
         */
        function processMapping(data) {
            if (!data || !data.lezioni) return;
            mappingData = data;
            lessonMapping = {};

            // Compila URL promo se presente
            if (data.promo?.url_completo) {
                CONFIG.promo_video_url = data.promo.url_completo;
            }

            // Costruisci lookup normalizzata
            for (const [key, value] of Object.entries(data.lezioni)) {
                const normalized = normalizeLessonName(key);
                lessonMapping[normalized] = {
                    slug: value.slug || key,
                    descrizione: value.descrizione || '',
                    s3_url: buildS3Url(value.slug)
                };
            }
        }

        // ================================================================
        // FETCH — CLASSI (dal sistema di pianificazione)
        // ================================================================
        async function fetchClasses() {
            try {
                const response = await fetch(`${CONFIG.apiUrl}?t=${Date.now()}`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('[VideoPlayer] Errore fetch classi:', error);
                updateConnectionStatus(false);
                return null;
            }
        }

        // ================================================================
        // SELEZIONE VIDEO
        // ================================================================

        /**
         * Determina quale video mostrare in base a:
         * 1. Querystring ?lezione= (priorità massima)
         * 2. Lezione attualmente in corso (dalla schedule)
         * 3. Video promo / fallback
         *
         * @returns {{ url: string|null, source: string, label: string, slug: string|null }}
         */
        function selectVideo() {
            // --- 1. Override da querystring ---
            const params = getQueryParams();
            if (params[CONFIG.lessonParam]) {
                const forcedName = params[CONFIG.lessonParam];
                const entry = findMappingEntry(forcedName, lessonMapping);
                if (entry?.s3_url) {
                    return {
                        url: entry.s3_url,
                        source: 'lesson',
                        label: forcedName,
                        slug: entry.slug
                    };
                }
                // Se forzato ma senza mapping, prova almeno lo slug come video
                const forcedSlug = encodeURIComponent(forcedName.replace(/\s+/g, '_'));
                return {
                    url: buildS3Url(forcedSlug),
                    source: 'lesson',
                    label: forcedName,
                    slug: forcedSlug
                };
            }

            // --- 2. Lezione in corso ---
            const current = getCurrentClass();
            if (current && current.name) {
                const entry = findMappingEntry(current.name, lessonMapping);
                if (entry?.s3_url) {
                    return {
                        url: entry.s3_url,
                        source: 'lesson',
                        label: current.name,
                        slug: entry.slug
                    };
                }
                // Lezione trovata ma nessun video specifico → video promo
                if (CONFIG.promo_video_url) {
                    return {
                        url: CONFIG.promo_video_url,
                        source: 'promo',
                        label: current.name,
                        slug: null
                    };
                }
            }

            // --- 3. Fallback promo ---
            if (CONFIG.promo_video_url) {
                return {
                    url: CONFIG.promo_video_url,
                    source: 'promo',
                    label: 'Lume Fitness',
                    slug: null
                };
            }

            // --- 4. Fallback ultimo: nessun video configurato ---
            return { url: null, source: 'none', label: null, slug: null };
        }

        // ================================================================
        // GESTIONE ERRORI VIDEO (italiano)
        // ================================================================
        function showVideoError(title, description) {
            const video = document.getElementById('promoVideo');
            const loading = document.getElementById('videoLoading');
            const error = document.getElementById('videoError');
            const errorTitle = document.getElementById('videoErrorTitle');
            const errorDesc = document.getElementById('videoErrorDesc');

            if (video) video.style.display = 'none';
            if (loading) loading.style.display = 'none';
            if (error) {
                errorTitle.textContent = title;
                errorDesc.textContent = description;
                error.classList.add('visible');
            }
        }

        function hideVideoError() {
            const error = document.getElementById('videoError');
            if (error) error.classList.remove('visible');
        }

        // ================================================================
        // PLAYER VIDEO
        // ================================================================
        function loadVideoForLesson() {
            const video = document.getElementById('promoVideo');
            const loading = document.getElementById('videoLoading');
            const loadingText = document.getElementById('videoLoadingText');
            const infoBar = document.getElementById('videoInfoBar');
            const lessonBadge = document.getElementById('videoLessonBadge');
            const lessonNameEl = document.getElementById('videoLessonName');
            const downloadLink = document.getElementById('videoDownloadLink');

            // Seleziona video
            const selection = selectVideo();
            currentVideoSource = selection.source;
            currentLessonSlug = selection.slug;

            // Aggiorna UI info bar
            if (lessonNameEl) lessonNameEl.textContent = selection.label || '—';
            if (infoBar) {
                infoBar.classList.toggle('visible', selection.url !== null);
            }

            if (!selection.url) {
                // Nessun video configurato
                if (loadingText) loadingText.textContent = 'Nessun video configurato per questa lezione';
                return;
            }

            // Mostra loading con contesto
            if (loadingText) {
                loadingText.textContent = selection.label
                    ? `Video per: ${selection.label}`
                    : 'Caricamento video...';
            }
            if (loading) loading.style.display = 'flex';
            hideVideoError();

            // Imposta sorgente video
            video.src = selection.url;
            if (downloadLink) downloadLink.href = selection.url;

            video.oncanplay = () => {
                if (loading) loading.style.display = 'none';
                video.style.display = 'block';
                video.play().catch(err => {
                    console.warn('[VideoPlayer] Autoplay bloccato:', err.message);
                    // Non mostriamo errore — il browser potrebbe richiedere interazione
                });
            };

            video.onerror = () => {
                console.warn(`[VideoPlayer] Errore caricamento video: ${selection.url}`);
                handleVideoLoadError(selection);
            };

            video.onended = () => {
                // Video finito — passa alla prossima slide
                console.log('[VideoPlayer] Video terminato');
            };

            video.load();
        }

        /**
         * Gestisce gli errori di caricamento video con fallback a cascata.
         * @param {{ url: string, source: string, label: string, slug: string }} selection
         */
        function handleVideoLoadError(selection) {
            // Strategia fallback:
            // 1. Se è un video S3 lezione → prova il promo
            // 2. Se il promo fallisce → prova fallback YouTube
            // 3. Se tutto fallisce → mostra errore in italiano

            if (selection.source === 'lesson' && CONFIG.promo_video_url) {
                console.log('[VideoPlayer] Video lezione non disponibile, provo promo...');
                const video = document.getElementById('promoVideo');
                video.src = CONFIG.promo_video_url;
                video.load();
                video.onerror = () => handleVideoLoadError({ ...selection, source: 'promo' });
                return;
            }

            if (selection.source === 'promo' || (selection.source === 'lesson' && !CONFIG.promo_video_url)) {
                // Prova YouTube embed come ultimo fallback
                if (CONFIG.fallback_youtube_id) {
                    console.log('[VideoPlayer] Provo fallback YouTube...');
                    showYoutubeFallback();
                    return;
                }
            }

            // Tutto fallito
            showVideoError(
                'Video non disponibile',
                `Impossibile caricare il video per "${selection.label || 'questa lezione'}". ` +
                `Verifica che il file esista su S3 e che l'URL sia corretto.`
            );
        }

        /**
         * Mostra un iframe YouTube come fallback estremo.
         * Usato solo quando non c'è nessun video S3 disponibile.
         */
        function showYoutubeFallback() {
            const videoSlide = document.getElementById('videoSlide');
            const video = document.getElementById('promoVideo');
            const loading = document.getElementById('videoLoading');
            const error = document.getElementById('videoError');

            if (loading) loading.style.display = 'none';
            if (video) video.style.display = 'none';
            if (error) error.classList.remove('visible');

            // Rimuovi iframe precedente se presente
            const old = videoSlide?.querySelector('.youtube-fallback');
            if (old) old.remove();

            const iframe = document.createElement('iframe');
            iframe.className = 'youtube-fallback';
            iframe.setAttribute('src', `https://www.youtube.com/embed/${CONFIG.fallback_youtube_id}?autoplay=1&controls=1&rel=0`);
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
            iframe.setAttribute('allowfullscreen', '');
            iframe.setAttribute('title', 'Video lezione — fallback');
            iframe.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;';
            iframe.setAttribute('aria-label', 'Video lezione da YouTube (fallback)');

            if (videoSlide) {
                videoSlide.appendChild(iframe);
            }
        }

        // ================================================================
        // ROOMS (pianificazione)
        // ================================================================
        const ROOMS = [
            {
                id: 'sala1',
                name: 'SALA 1',
                filter: c => c.room?.toLowerCase().includes('sala 1') || (!c.room && c.category === 'fitness')
            },
            {
                id: 'sala2',
                name: 'SALA 2',
                filter: c => c.room?.toLowerCase().includes('sala 2') || (!c.room && c.category === 'acqua')
            },
            {
                id: 'sala3',
                name: 'SALA 3 - REFORMER',
                filter: c => c.room?.toLowerCase().includes('sala 3') || c.category === 'reformer' ||
                    c.name?.toLowerCase().includes('reformer') || c.name?.toLowerCase().includes('wbs')
            },
        ];

        function getCurrentAndNext(classes) {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            const sorted = [...(classes || [])].sort((a, b) => {
                const [ah, am] = (a.time || '').split(':').map(Number);
                const [bh, bm] = (b.time || '').split(':').map(Number);
                return (ah * 60 + am) - (bh * 60 + bm);
            });

            let current = null;
            let next = [];

            for (const c of sorted) {
                const [h, m] = (c.time || '').split(':').map(Number);
                if (isNaN(h)) continue;
                const startMinutes = h * 60 + m;
                const duration = parseInt(c.duration) || 60;
                const endMinutes = startMinutes + duration;

                if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
                    current = c;
                } else if (startMinutes > currentMinutes && next.length < 2) {
                    next.push(c);
                }
            }
            return { current, next };
        }

        function getRoomStatus(room, allClasses) {
            const roomClasses = (allClasses || []).filter(room.filter);
            const { current, next } = getCurrentAndNext(roomClasses);
            return {
                room,
                current,
                next: next[0] || null,
                status: current ? 'live' : (next[0] ? 'next' : 'free')
            };
        }

        function getRoomColor(roomId) {
            const colors = {
                'sala1': 'var(--accent-pink)',
                'sala2': 'var(--accent-cyan)',
                'sala3': 'var(--accent-purple)',
            };
            return colors[roomId] || 'var(--text-primary)';
        }

        function renderRooms(allClasses) {
            const container = document.getElementById('roomsGrid');
            if (!container) return;

            const roomStatuses = ROOMS.map(room => getRoomStatus(room, allClasses));

            let html = '';
            roomStatuses.forEach((status, i) => {
                const { room, current, next, status: roomStatus } = status;

                const cardClass = roomStatus === 'live' ? 'active' : (roomStatus === 'free' ? 'empty' : '');
                const statusText = roomStatus === 'live' ? 'IN CORSO' : (roomStatus === 'next' ? 'PROSSIMO' : 'LIBERA');
                const statusClass = roomStatus === 'live' ? 'live' : (roomStatus === 'next' ? 'next' : 'free');

                html += `
                    <div class="room-card ${cardClass}" style="animation: fadeIn 0.5s ease ${i * 0.1}s forwards; opacity: 0;" role="listitem">
                        <div class="room-header">
                            <div class="room-name" style="color: ${getRoomColor(room.id)}">${room.name}</div>
                            <div class="room-status ${statusClass}">${statusText}</div>
                        </div>
                        ${current ? `
                            <div class="room-current">
                                <div class="room-current-label">In corso</div>
                                <div class="room-current-class">${current.name || '—'}</div>
                                <div class="room-current-time">${current.time || ''} &bull; ${current.duration || ''}</div>
                                <div class="room-current-instructor">&#128100; ${current.instructor || '—'}</div>
                            </div>
                            <div class="room-availability ${current.is_full ? 'full' : 'available'}">
                                ${current.is_full ? 'SALA PIENA' : `${current.available_places ?? '—'} posti disponibili`}
                            </div>
                        ` : next ? `
                            <div class="room-current">
                                <div class="room-current-label">Prossimo corso</div>
                                <div class="room-current-class" style="font-size: 20px; color: var(--text-secondary);">Sala libera</div>
                            </div>
                            <div class="room-next">
                                <div class="room-next-label">A seguire</div>
                                <div class="room-next-class">${next.name || '—'}</div>
                                <div class="room-next-time">${next.time || ''} &bull; ${next.duration || ''}</div>
                            </div>
                            <div class="room-availability waiting">
                                Prossimo alle ${next.time || '—'}
                            </div>
                        ` : `
                            <div class="room-current">
                                <div class="room-current-label">Stato</div>
                                <div class="room-current-class" style="font-size: 20px; color: var(--accent-orange);">&#10024; Sala Libera</div>
                                <div class="room-current-time" style="margin-top: 10px;">Nessun corso previsto</div>
                            </div>
                            <div class="room-availability waiting">
                                A disposizione
                            </div>
                        `}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ================================================================
        // UPDATE PLANNING
        // ================================================================
        async function updatePlanning() {
            const data = await fetchClasses();
            if (!data) return;

            const newHash = hashData(data);
            if (newHash === lastDataHash) {
                updateConnectionStatus(true);
                return;
            }
            lastDataHash = newHash;
            classesData = data;

            const today = new Date();
            const dayName = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'][today.getDay()];
            const todayClasses = data.classes?.[CONFIG.location]?.[dayName] || [];

            renderRooms(todayClasses);
            updateConnectionStatus(true);
        }

        // ================================================================
        // SLIDE ROTATION
        // ================================================================
        function showSlide(index) {
            const slides = document.querySelectorAll('.slide');
            slides.forEach((s, i) => s.classList.toggle('active', i === index));
            currentSlide = index;

            // Rimuovi YouTube fallback se torniamo sulla slide video
            if (index === 0) {
                const ytFallback = document.querySelector('.youtube-fallback');
                if (ytFallback) ytFallback.remove();
                hideVideoError();
            }

            if (index === 0) {
                // Slide video — ricarica video basato su lezione attuale
                loadVideoForLesson();
                startProgress(CONFIG.videoDuration);
            } else {
                // Slide planning
                const video = document.getElementById('promoVideo');
                if (video) video.pause();
                updatePlanning();
                startProgress(CONFIG.planningDuration);
            }
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.slide');
            const next = (currentSlide + 1) % slides.length;

            if (next === 0) {
                currentVideoIndex = (currentVideoIndex + 1) % Math.max(
                    CONFIG.videos?.length || 1,
                    CONFIG.localVideos?.length || 1
                );
            }
            showSlide(next);
        }

        // ================================================================
        // PROGRESS BAR
        // ================================================================
        function startProgress(duration) {
            const bar = document.getElementById('progressBar');
            let progress = 0;
            const step = 100 / (duration / 100);

            clearInterval(progressTimer);
            progressTimer = setInterval(() => {
                progress += step;
                if (bar) bar.style.width = Math.min(progress, 100) + '%';

                if (progress >= 100) {
                    clearInterval(progressTimer);
                    nextSlide();
                }
            }, 100);
        }

        // ================================================================
        // INIT
        // ================================================================
        async function init() {
            // 1. Leggi querystring per lezione forzata
            const params = getQueryParams();
            if (params[CONFIG.lessonParam]) {
                forcedLesson = params[CONFIG.lessonParam];
                console.log(`[VideoPlayer] Lezione forzata da querystring: ${forcedLesson}`);
            }

            // 2. Carica mappatura lezioni → video
            const mapping = await fetchMapping();
            if (mapping) {
                processMapping(mapping);
                console.log('[VideoPlayer] Mapping caricato:', Object.keys(lessonMapping).length, 'lezioni');
            } else {
                console.warn('[VideoPlayer] Nessun mapping disponibile — uso fallback');
            }

            // 3. Carica dati iniziali classi
            await updatePlanning();

            // 4. Avvia rotazione slide
            showSlide(0);

            // 5. Refresh periodico
            setInterval(() => {
                if (currentSlide === 1) {
                    updatePlanning();
                }
                // Ricarica anche il video se siamo sulla slide video
                // (la lezione corrente potrebbe essere cambiata)
                if (currentSlide === 0) {
                    loadVideoForLesson();
                }
            }, CONFIG.refreshInterval);
        }

        // Avvia quando il DOM è pronto
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
